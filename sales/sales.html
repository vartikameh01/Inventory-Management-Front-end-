<!DOCTYPE html>
<html>
<head>
    <title>Sales</title>
    <link rel="stylesheet" href="./sales.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>InvenTrack</h2>
        <ul>
            <li>Dashboard</li>
            <li>Products</li>
            <li>Inventory</li>
            <li class="active">Sales</li>
            <li>Purchases</li>
            <li>Users</li>
            <br><br><br><br><br><br><br><br><br>
        </ul>

        <ul class="bottom-menu">
            <li>Settings</li>
            <li>Logout</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Header -->
        <div class="header">
            <h1>Sales & Purchases</h1>
            <button onclick="openForm()">+ New Sale</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="active">Sales</button>
            <button>Purchases</button>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>supplier</th>
                    <th>category</th>
                    <th>purchase</th>
                    
                </tr>
            </thead>
            <tbody id="salesTable"></tbody>
        </table>

    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="form">
        <h2>Add Sale</h2>

        <input type="text" id="customer" placeholder="Customer Name">
        <input type="number" id="amount" placeholder="Amount">

        <select id="status">
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>

        <button type="button" onclick="addSale()">Save</button>
        <button type="button" onclick="closeForm()">Cancel</button>
    </div>
</div>

<script src="./sales.js"></script>
</body>
</html>
