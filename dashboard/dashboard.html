<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="./dashboard.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>InvenTrack</h2>
        <ul>
            <li class="active">Dashboard</li>
            <li>Products</li>
            <li>Sales</li>
            <li>Purchases</li>
            <li>Users</li>
            <li>Settings</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">
        <h1>Dashboard</h1>
        <p id="welcome">Welcome back, User</p>

        <!-- Cards -->
        <div class="cards">

            <div class="card">
                <h3>Total Products</h3>
                <h2 id="products">0</h2>
                <p class="growth positive">+12% growth</p>
            </div>

            <div class="card">
                <h3>Total Sales</h3>
                <h2 id="sales">0</h2>
                <p class="growth positive">+8% growth</p>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <h2 id="stock">0</h2>
                <p class="growth negative">-3% drop</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <h2 id="revenue">0</h2>
                <p class="growth positive">+23% growth</p>
            </div>

        </div>

    </div>
</div>

<script src="./dashboard.js"></script>
</body>
</html>
